<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>household-restock</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main>
      <h1>household-restock</h1>
      <p class="lead">最小画面（localhost 中継）。秘密はブラウザに置きません。</p>

      <p id="status" role="status" aria-live="polite"></p>
      <p id="error" role="alert" hidden></p>

      <section aria-labelledby="items-heading">
        <div class="row">
          <h2 id="items-heading">在庫</h2>
          <button type="button" id="reload">再読込</button>
        </div>
        <table>
          <thead>
            <tr>
              <th scope="col">品目</th>
              <th scope="col">しきい値</th>
              <th scope="col">在庫</th>
              <th scope="col">注文失敗モード</th>
              <th scope="col">操作</th>
            </tr>
          </thead>
          <tbody id="items-body"></tbody>
        </table>
      </section>

      <section aria-labelledby="restock-heading">
        <h2 id="restock-heading">補充リクエスト</h2>
        <table>
          <thead>
            <tr>
              <th scope="col">品目</th>
              <th scope="col">eventId</th>
              <th scope="col">状態</th>
              <th scope="col">操作</th>
            </tr>
          </thead>
          <tbody id="restock-body"></tbody>
        </table>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
