AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: household-restock v0.3.0 — minimal UI via localhost relay; protected APIs

Parameters:
  DemoItemId:
    Type: String
    Default: toilet-paper
    Description: Fictional single item id used in docs and seed script
  ApprovalTimeoutSeconds:
    Type: Number
    Default: 300
    MinValue: 30
    MaxValue: 86400
    Description: waitForTaskToken timeout (shorten for AWS verify)
  StreamMaxRetryAttempts:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 10
    Description: DynamoDB Streams event source max retry attempts
  ApprovalSharedSecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared secret for X-Approval-Secret (never commit the value)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64

Resources:
  HouseholdRestockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  ApprovalHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

  StoreTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: household_restock.store_token.lambda_handler
      Description: Persist task token server-side; never return it
      Environment:
        Variables:
          TABLE_NAME: !Ref HouseholdRestockTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HouseholdRestockTable

  DecisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: household_restock.decision_api.lambda_handler
      Description: Approve/reject restock without exposing task token
      Environment:
        Variables:
          TABLE_NAME: !Ref HouseholdRestockTable
          APPROVAL_SHARED_SECRET: !Ref ApprovalSharedSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HouseholdRestockTable
        - Statement:
            - Effect: Allow
              Action:
                - states:SendTaskSuccess
                - states:SendTaskFailure
              Resource: "*"
      Events:
        Decide:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApprovalHttpApi
            Path: /items/{itemId}/restock-requests/{streamEventId}/decision
            Method: POST

  ItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: household_restock.items_api.lambda_handler
      Description: List items/restocks and update stock; shared secret required
      Environment:
        Variables:
          TABLE_NAME: !Ref HouseholdRestockTable
          APPROVAL_SHARED_SECRET: !Ref ApprovalSharedSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HouseholdRestockTable
      Events:
        ListItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApprovalHttpApi
            Path: /items
            Method: GET
        PutStock:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApprovalHttpApi
            Path: /items/{itemId}/stock
            Method: PUT
        ListRestocks:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApprovalHttpApi
            Path: /restock-requests
            Method: GET

  RestockStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachine/restock.asl.json
      DefinitionSubstitutions:
        TableName: !Ref HouseholdRestockTable
        StoreTokenFunctionArn: !GetAtt StoreTokenFunction.Arn
        ApprovalTimeoutSeconds: !Ref ApprovalTimeoutSeconds
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref HouseholdRestockTable
        - DynamoDBReadPolicy:
            TableName: !Ref HouseholdRestockTable
        - LambdaInvokePolicy:
            FunctionName: !Ref StoreTokenFunction

  EvaluateStockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: household_restock.handler.lambda_handler
      Description: Streams → occupy → start SFN (ReportBatchItemFailures)
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref RestockStateMachine
          TABLE_NAME: !Ref HouseholdRestockTable
          DEMO_ITEM_ID: !Ref DemoItemId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HouseholdRestockTable
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Ref RestockStateMachine
      Events:
        ItemStockStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt HouseholdRestockTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 0
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: !Ref StreamMaxRetryAttempts
            FunctionResponseTypes:
              - ReportBatchItemFailures
            FilterCriteria:
              Filters:
                - Pattern: >-
                    {"dynamodb":{"Keys":{"sk":{"S":["META"]}},"NewImage":{"entityType":{"S":["ITEM"]}}}}

Outputs:
  HouseholdRestockTableName:
    Description: DynamoDB table for items, locks, and restock requests
    Value: !Ref HouseholdRestockTable
  RestockStateMachineArn:
    Description: Standard Step Functions ARN
    Value: !Ref RestockStateMachine
  EvaluateStockFunctionArn:
    Description: Stream evaluator Lambda ARN
    Value: !GetAtt EvaluateStockFunction.Arn
  ApprovalApiUrl:
    Description: Base URL for approval HTTP API
    Value: !Sub "https://${ApprovalHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  ApprovalDecisionPathTemplate:
    Description: POST path template (add X-Approval-Secret header)
    Value: /items/{itemId}/restock-requests/{streamEventId}/decision
  ItemsPath:
    Description: GET /items (X-Approval-Secret required; use via localhost relay)
    Value: /items
  RestockRequestsPath:
    Description: GET /restock-requests (X-Approval-Secret required)
    Value: /restock-requests
  DemoItemId:
    Description: Demo item id
    Value: !Ref DemoItemId
  ApprovalTimeoutSeconds:
    Description: Configured approval timeout
    Value: !Ref ApprovalTimeoutSeconds
