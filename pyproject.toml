[project]
name = "household-restock"
version = "0.0.0"
description = "日用品自動補充ワークフロー学習用（環境と計画のみ。業務機能は未実装）"
requires-python = "==3.12.*"
readme = "README.md"
dependencies = []

# ランタイム業務依存はまだ持たない。
# Python 本体は mise（3.12.16）。パッケージは下の dev グループ + uv.lock。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/household_restock"]

[dependency-groups]
dev = [
  "aws-sam-cli==1.145.2",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.3",
  "vulture==2.14",
]

[tool.uv]
default-groups = ["dev"]
# mise が入れた Python を使う。uv が別系統の Python を勝手に取得しない。
python-preference = "only-system"
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "-q",
  "--cov=household_restock",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["household_restock"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "scripts"]
extend-exclude = [".agents", ".mise", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true
warn_unused_configs = true

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 60
exclude = [".venv/", ".agents/", "node_modules/"]
