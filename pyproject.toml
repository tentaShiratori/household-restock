[project]
name = "household-restock"
version = "0.2.0"
description = "日用品自動補充ワークフロー学習用（v0.2.0: 承認待ち・品目占有。画面は未実装）"
requires-python = "==3.12.*"
readme = "README.md"
dependencies = []

# ランタイム業務依存はまだ持たない。
# Python 本体は mise（3.12.16）。パッケージは下の dev グループ + uv.lock。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/household_restock"]

[dependency-groups]
dev = [
  "aws-sam-cli==1.145.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.3",
  "ty==0.0.99",
  "vulture==2.14",
]

[tool.uv]
default-groups = ["dev"]
# mise が入れた Python を使う。uv が別系統の Python を勝手に取得しない。
python-preference = "only-system"
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "-q",
  "--cov=household_restock",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["household_restock"]
# Lambda 入口（boto3）はローカル単体の対象外。純関数側を測る。
omit = [
  "*/household_restock/handler.py",
  "*/household_restock/store_token.py",
  "*/household_restock/decision_api.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "scripts"]
extend-exclude = [".agents", ".mise", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

# ty (Astral) は 0.0.x / PyPI Development Status: Beta（1.0 前のプレビュー相当）。
# 公式で可能な範囲の厳しめ設定: 全ルール error、警告も失敗、Python 3.12、厳格な narrowing。
[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true
return-type-inference = "always"
# Lambda ランタイム提供。ローカル venv には入れない。
allowed-unresolved-imports = ["boto3", "boto3.**", "botocore", "botocore.**"]

[tool.ty.terminal]
error-on-warning = true

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 60
exclude = [
  ".venv/",
  ".agents/",
  "node_modules/",
  "*/handler.py",
  "*/store_token.py",
  "*/decision_api.py",
]
